
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09090f;color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;display:flex;
}
.sidebar{
 width:250px;background:#101019;
 padding:22px;border-right:1px solid #252535;
}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
.new{
 width:100%;padding:13px;margin-top:35px;
 background:#a78bfa;color:#09090f;border:0;
 border-radius:9px;font-weight:bold;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{
 padding:20px 25px;border-bottom:1px solid #252535;
 font-weight:bold;
}
.chat{
 flex:1;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 padding:25px;overflow-y:auto;
}
.welcome{text-align:center;max-width:500px}
.welcome h1{font-size:38px;margin-bottom:10px}
.welcome p{color:#999}
.messages{
 width:100%;max-width:720px;
 display:flex;flex-direction:column;gap:16px;
}
.message{
 padding:15px 18px;border-radius:13px;
 line-height:1.5;max-width:85%;white-space:pre-wrap;
}
.user{align-self:flex-end;background:#29243a}
.ai{align-self:flex-start;background:#171722}
.bottom{padding:20px;display:flex;justify-content:center}
.inputbox{
 display:flex;gap:10px;width:100%;max-width:720px;
 background:#171722;border:1px solid #343446;
 border-radius:13px;padding:9px;
}
input{
 flex:1;min-width:0;background:transparent;
 border:0;outline:none;color:white;padding:10px;
 font-size:15px;
}
.send{
 background:#a78bfa;color:#09090f;border:0;
 border-radius:9px;padding:0 19px;font-weight:bold;
}
.note{font-size:11px;color:#666;text-align:center;margin-top:10px}
@media(max-width:600px){
 .sidebar{width:65px;padding:12px}
 .logo{font-size:17px}
 .sidebar .sideText{display:none}
 .new{font-size:20px;padding:10px 0}
 .welcome h1{font-size:29px}
}
</style>
</head>
<body>
<aside class="sidebar">
 <div class="logo">Zenix.</div>
 <button class="new" onclick="newChat()">＋ <span class="sideText">New chat</span></button>
</aside>
<main class="main">
 <header class="top">Zenix AI <span style="color:#a78bfa">•</span> Assistant</header>
 <section class="chat" id="chat">
  <div class="welcome" id="welcome">
   <h1>Welcome to Zenix AI.</h1>
   <p>Your ideas. Your questions. One intelligent assistant.</p>
  </div>
  <div class="messages" id="messages"></div>
 </section>
 <footer class="bottom">
  <div style="width:100%;max-width:720px">
   <div class="inputbox">
    <input id="prompt" placeholder="Message Zenix AI..." autocomplete="off">
    <button class="send" onclick="sendMessage()">Send</button>
   </div>
   <div class="note">Zenix AI can make mistakes. Always verify important information.</div>
  </div>
 </footer>
</main>
<script>
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 messages.appendChild(div);
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 welcome.style.display="none";
 addMessage(text,"user");
 input.value="";
 addMessage("Welcome! I'm Zenix AI. My AI brain isn't connected yet. We're building that next!","ai");
 document.getElementById("chat").scrollTop=
 document.getElementById("chat").scrollHeight;
}

function newChat(){
 messages.innerHTML="";
 welcome.style.display="block";
 input.value="";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
